{% load static %}

<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <!--
        AutoValue AI
        ----------------
        Main Django entry template.

        WHY:
        The backend should continue serving one stable HTML entry point.
        The frontend JavaScript loads the individual application pages.

        This keeps the UI independent from the prediction backend.
    -->

    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="AutoValue AI - intelligent used-car valuation"
    >

    <title>AutoValue AI</title>

    <!-- Prevent a visible flash of the wrong theme on page load. -->
    <script src="{% static 'predictor/js/theme.js' %}"></script>

    <link
        rel="stylesheet"
        href="{% static 'predictor/css/style.css' %}"
    >
</head>

<body>
    <!--
        CSRF token container.

        WHY:
        The prediction API is protected by Django CSRF middleware.
        JavaScript reads this token and sends it with fetch().
    -->
    <div id="csrf-token-container" hidden>
        {% csrf_token %}
    </div>
    <!--
        Application root.

        app.js controls which frontend page is displayed here.
    -->
    <div id="app"></div>

    <noscript>
        <div class="noscript-message">
            AutoValue AI requires JavaScript to run.
            Please enable JavaScript and reload the page.
        </div>
    </noscript>

    <script
        src="{% static 'predictor/js/pages/dashboard.js' %}"
        defer
    ></script>

    <script
        src="{% static 'predictor/js/pages/predict.js' %}"
        defer
    ></script>

    <script
        src="{% static 'predictor/js/pages/results.js' %}"
        defer
    ></script>

    <script
        src="{% static 'predictor/js/pages/how-it-works.js' %}"
        defer
    ></script>

    <script
        src="{% static 'predictor/js/app.js' %}"
        defer
    ></script>

</body>
</html>
